<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paletto</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>

<body class="bg-neutral-800 flex justify-center items-center min-h-screen">
    <main class="card bg-base-100 w-full max-w-lg shadow-xl overflow-hidden">
        <div class="flex items-center gap-3 p-4">
            <input type="color" name="seed-color" id="seed-color" class="w-16 h-12 rounded cursor-pointer border-none"
                value="#f55a5a">
            <select id="color-style" class="select select-bordered flex-1">
                <option value="monochrome">Monochrome</option>
                <option value="monochrome-dark">Monochrome-dark</option>
                <option value="monochrome-light">Monochrome-light</option>
                <option value="analogic">Analogic</option>
                <option value="complement">Complement</option>
                <option value="analogic-complement">Analogic-complement</option>
                <option value="triad">Triad</option>
            </select>
            <button id="generate-btn" class="btn">Get colour scheme</button>
        </div>
        <div id="swatch-colors" class="flex h-96"></div>
        <div id="hex-codes" class="flex justify-around py-3 bg-base-200"></div>
        <div id="copy-msg" class="hidden text-center py-2 text-success font-semibold">Copied!</div>
    </main>
</body>

</html>
