<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paletto</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>

<body>
    <main class="container px-4 py-4">
        <div class="flex gap-4">
            <input type="color" name="seed-color" id="seed-color" value="#f55a5a">
            <select id="color-style">
                <option value="monochrome">Monochrome</option>
                <option value="monochrome-dark">Monochrome-dark</option>
                <option value="monochrome-light">Monochrome-light</option>
                <option value="analogic">Analogic</option>
                <option value="complement">Complement</option>
                <option value="analogic-complement">Analogic-complement</option>
                <option value="triad">Triad</option>
            </select>
            <button id="generate-btn" class="btn">Get colour scheme</button>
        </div>
        <div id="swatch-colors" class="flex"></div>
        <div id="hex-codes" class="flex justify-around"></div>

        <div id="copy-msg" class="hidden">Copied!</div>
    </main>
</body>

</html>
